# Copy this file to secrets.yaml and fill in the values.
#
#   cp web/secrets.example.yaml web/secrets.yaml
#
# secrets.yaml is git-ignored. app.yaml pulls it in via `includes:`, so the
# values below become environment variables on App Engine without ever being
# committed. `.\dd.ps1 deploy` refuses to run if secrets.yaml is missing.
env_variables:
  # Signs Flask session cookies. Must be a long random string, and must stay
  # stable across deploys or everyone gets logged out. Generate one with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  SECRET_KEY: "replace-me"

  # Google OAuth2 client ID. Leave empty to disable sign-in entirely.
  GOOGLE_CLIENT_ID: ""
