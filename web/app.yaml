runtime: python310
entrypoint: gunicorn -b :$PORT main:app

env_variables:
  # Set your Google OAuth2 Client ID from Google Cloud Console
  # GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"
  # Comma-separated list of admin email addresses
  # ADMIN_EMAILS: "admin@example.com"
  # Secret key for Flask sessions (generate a secure random string)
  # SECRET_KEY: "your-secret-key-here"

handlers:
# Immutable media: safe to cache for a long time.
- url: /static/icons
  static_dir: static/icons
  expiration: "30d"
  secure: always
- url: /static/sid
  static_dir: static/sid
  expiration: "30d"
  secure: always
# Code and markup change on every deploy, so keep the window short.
- url: /static
  static_dir: static
  expiration: "1h"
  secure: always
- url: /.*
  script: auto
  secure: always
