runtime: python310
entrypoint: gunicorn -b :$PORT main:app

# Secrets live in web/secrets.yaml, which is git-ignored so they are never
# committed. Copy secrets.example.yaml to secrets.yaml and fill it in; the
# deploy will refuse to run without it. See README.md.
includes:
  - secrets.yaml

handlers:
# Immutable media: safe to cache for a long time.
- url: /static/icons
  static_dir: static/icons
  expiration: "30d"
  secure: always
- url: /static/sid
  static_dir: static/sid
  expiration: "30d"
  secure: always
# Code and markup change on every deploy, so keep the window short.
- url: /static
  static_dir: static
  expiration: "1h"
  secure: always
- url: /.*
  script: auto
  secure: always
